<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #0B0F14;
        font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, Arial, sans-serif;
        color: #F2F5F8;
      }
      #stage { width: 1920px; height: 1080px; display: flex; flex-direction: column;
               justify-content: center; padding: 0 173px; }
      #kicker { font-weight: 700; letter-spacing: 6px; font-size: 26px;
                color: #22D3A7; margin-bottom: 18px; }
      #title { font-weight: 800; font-size: 88px; line-height: 1.05; margin-bottom: 56px; }
      .row { display: flex; align-items: center; gap: 24px; margin-bottom: 28px; }
      .num { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 14px;
             background: #151B23; border: 2px solid #4F8CFF; color: #4F8CFF;
             font-weight: 800; font-size: 30px; display: flex;
             align-items: center; justify-content: center; }
      .label { font-weight: 600; font-size: 46px; color: #F2F5F8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6"
         data-width="1920" data-height="1080">
      <div id="stage">
        <div id="kicker" class="clip" data-start="0" data-duration="6" data-track-index="0">
          BORING AI AUTOMATIONS
        </div>
        <div id="title" class="clip" data-start="0" data-duration="6" data-track-index="1">
          3 boring tasks AI can automate
        </div>
        <div class="row clip" data-start="0.8" data-duration="5.2" data-track-index="2">
          <div class="num">1</div><div class="label">Clean messy spreadsheet imports</div>
        </div>
        <div class="row clip" data-start="1.4" data-duration="4.6" data-track-index="3">
          <div class="num">2</div><div class="label">Email invoices automatically</div>
        </div>
        <div class="row clip" data-start="2.0" data-duration="4.0" data-track-index="4">
          <div class="num">3</div><div class="label">Auto-build weekly schedules</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#kicker", { opacity: 0, duration: 0.6, ease: "power2.out" }, 0);
      tl.from("#title", { opacity: 0, y: 40, duration: 0.7, ease: "power3.out" }, 0);
      tl.from(".row", { opacity: 0, x: -40, duration: 0.5, ease: "power2.out", stagger: 0.6 }, 0.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
