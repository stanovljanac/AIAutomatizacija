<!doctype html>
<!--
  sf-results — 026 s10 — the same three breaks, caught at the top
  Mechanical 3D (HF3 + _lib/hf-mech.js + the 026 objects in _lib/hf-watch.js). Face-on by default.
  Seek-driven and deterministic: window.__hfThreeTime + hf-seek, no rAF / Date.now / Math.random.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,revealsSeconds[],props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":300},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":10}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-three.js"></script>
    <script src="../../_lib/hf-world.js"></script>
    <script src="../../_lib/hf-mech.js"></script>
    <script src="../../_lib/hf-watch.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="../../_lib/hf-world.css" />
    <link rel="stylesheet" href="../../_lib/hf-mech.css" />
    <link rel="stylesheet" href="sf-results.css" />
    <script>
      // rewritten to ../vendor/… by _lib/make-entry.mjs for the generated entry
      window.__THREE_URL = "./vendor/three.module.min.js";
    </script>
  </head>
  <body>
    <div id="root" class="pal-body" data-composition-id="sf-results" data-start="0" data-width="1920" data-height="1080">
      <canvas id="gl" data-layout-ignore></canvas>
      <div class="hw-hud" id="hud"></div>
    </div>
    <script src="sf-results.js"></script>
  </body>
</html>
