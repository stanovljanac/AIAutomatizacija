<!doctype html>
<!--
  cd-would-you-catch-it — HyperFrames CTA MONOLITH for 020 Short, s5 (the takeaway).
  ("Fixing your data first is unsexy — that's the point. So don't ask if AI can build it.
    Ask if you'd catch it when it's wrong. Follow — I pressure-test the boring parts everyone skips.")
  Black + gold outro. Screenshotable. Late brand elements in RESERVED space below, never over text.

  BEAT 0  "Fixing your data first is unsexy — that's the point." — a small held gold-on-black line
          lands: "Unsexy — that's the point." (the everyone-asks-ai lane signature, used once).
  BEAT 1  "So don't ask if AI can build it." — the monolith assembles: "CAN AI BUILD IT?" then a hard
          gold slash STRIKES it through.
  BEAT 2  "Ask if you'd catch it when it's wrong." — the card 3D Y-FLIPS (approved transient reveal) to
          the real question: "WOULD YOU CATCH IT WHEN IT'S WRONG?" — held ≥4s with a subtle gold pulse
          and a blinking gold caret (comment bait).
  BEAT 3  "Follow — I pressure-test the boring parts everyone skips." — the brand row RISES in reserved
          space BELOW the monolith: The Automation Desk + "the boring parts everyone skips."

  Everything SYNTHETIC. Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1080},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1920},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":386},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":12.87}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="../cd-would-you-catch-it.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cd-would-you-catch-it" data-start="0" data-duration="12.85" data-width="1080" data-height="1920">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="glow" id="glow"></div></div>

      <div class="stage" id="stage">
        <!-- the lane signature line -->
        <div class="unsexy" id="unsexy">Unsexy — that's the point.</div>

        <!-- the flip monolith: front = the wrong question (struck), back = the real one -->
        <div class="flipwrap">
          <div class="flip" id="flip">
            <div class="face front" id="front">
              <span class="q">CAN AI<br/>BUILD IT?</span>
              <span class="slash" id="slash"></span>
            </div>
            <div class="face back" id="back">
              <span class="q big">WOULD YOU<br/>CATCH IT<br/>WHEN IT'S<br/>WRONG?<span class="caret" id="caret">_</span></span>
            </div>
          </div>
        </div>

        <!-- the brand row, in reserved space BELOW the monolith -->
        <div class="brand" id="brand">
          <div class="mark">
            <span class="logo">▦</span>
            <span class="bname">The Automation Desk</span>
          </div>
          <div class="tag">the boring parts everyone skips.</div>
        </div>
      </div>
    </div>
    <script src="../cd-would-you-catch-it.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["cd-would-you-catch-it"] = tl;
    </script>
  </body>
</html>
