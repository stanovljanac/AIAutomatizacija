<!doctype html>
<!--
  cw-whole-chat — 022 long s4, ALTERNATIVE TAKE (16:9). Built beside cw-handoff, not instead of it,
  so the owner can compare the two cuts of the same beat.

  WHY A SECOND TAKE (owner, 2026-08-17): cw-handoff fixed the empty frame but "i dalje nije to to".
  The diagnosis is not the motion, it is the OBJECT. A stack of featureless white bars sliding around
  a dark frame is a bar chart; nothing in it says "this is your conversation", and for eighteen
  seconds there is no second thing on screen to care about. The hook works precisely because the
  thread is recognisable — and then we throw that recognition away.

  THE PREMISE THIS TAKE PLAYS INSTEAD — the DISPROPORTION.
  Your chat stays on screen the whole time, on the left, alive and growing. You send ONE line. The
  instant you do, a ghost of the WHOLE conversation detaches, flies across the desk and lands as a
  stack of paper. It is read. One page flies back and becomes its answer in your chat. Then the desk
  drops everything on the floor — and it has to happen again, one line later and one stack bigger.
  A chip counts what that costs: "you sent 1 · it read 12 → 14 → 16 → 18".

  Two problems solve themselves. The frame can never be empty, because your chat is the anchor and
  the desk is only ever a visitor — so the desk EMPTYING becomes the point instead of a hole. And the
  cause/effect is legible without a word: one small thing in, one huge thing across.

  BEATS (revealsSeconds)
    b0  "So picture a desk instead of a brain."      the brain dissolves; your chat and the desk arrive
    b1  "Every turn, you put the whole stack down…"  turn 1: send → the whole chat crosses → read
    b2  "It reads the stack from the top…"           the loop runs, each read longer, each stack bigger
    b3  "Then you hand it the stack again."          the biggest handover crosses and holds

  Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,revealsSeconds[],props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":544},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":18.13}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-whole-chat.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-whole-chat" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <!-- the wrong picture, dissolving out of the way -->
        <svg class="brain" id="brain" viewBox="0 0 200 200" fill="none">
          <circle cx="100" cy="100" r="72" stroke="#5d6f83" stroke-width="5" />
          <path d="M100 30 C 78 62, 122 78, 100 108 C 82 134, 120 146, 100 170" stroke="#5d6f83" stroke-width="5" stroke-linecap="round" />
          <path d="M62 58 C 84 84, 56 104, 74 132" stroke="#4d5d6f" stroke-width="4" stroke-linecap="round" />
          <path d="M138 58 C 116 84, 144 104, 126 132" stroke="#4d5d6f" stroke-width="4" stroke-linecap="round" />
        </svg>
        <div class="brainlbl" id="brainlbl"></div>

        <!-- the anchor: your chat, on screen for the whole scene -->
        <div class="phone" id="phone">
          <div class="threadclip" id="threadclip"><div class="thread" id="thread"></div></div>
        </div>
        <div class="phonelbl fx-lbl" id="phonelbl"></div>

        <!-- the copy of the whole conversation, in transit -->
        <div class="ghost" id="ghost"></div>

        <div class="deskhost" id="deskhost"></div>
        <div class="pilehost" id="pilehost"></div>
        <div class="sweephost" id="sweephost"></div>
        <div class="flyer" id="flyer"></div>
        <div class="impact" id="impact"></div>

        <div class="tag" id="tag"></div>
        <div class="chip fx-chip" id="chip"></div>
        <div class="kicker fx-h2" id="kicker"></div>
      </div>
    </div>
    <script src="cw-whole-chat.js"></script>
  </body>
</html>
