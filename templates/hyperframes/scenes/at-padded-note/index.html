<!doctype html>
<!--
  at-padded-note — 023 long s13 (phase 1) + s14 (phase 2). The second measurement, and the money shot.

  ph1  the short note sits as readable paper; eight lines of real office chatter slide in above and
       below it while the token counter climbs 30 → 236. The fact keeps its gold highlight the whole
       time and a chip states it is byte-identical: the experiment changed ONE thing.
  ph2  the deciding row is broken down into four labelled slices, each landing as it is spoken with
       its percentage AND its token count, so the injustice is visible: 1 token holds 25.8%, 3 tokens
       hold 10.0%. They sum on screen to 1.0000. On the last line the sink slice and the answer slice
       are lifted out side by side for the 2.5x comparison — the designed hold is long enough for the
       viewer to divide 25.8 by 10 themselves. One impact lands here; nothing else.

  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":569},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":18.98}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="at-padded-note.css" />
  </head>
  <body>
    <div id="root" data-composition-id="at-padded-note" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <!-- ph1: the page that grows -->
        <div class="pagecol" id="pagecol">
          <div class="ptop">
            <span class="ptitle" id="ptitle"></span>
            <span class="counter fx-mono" id="counter">30 tokens</span>
          </div>
          <div class="page" id="page">
            <div class="above" id="above"></div>
            <div class="factline" id="factline"></div>
            <div class="below" id="below"></div>
          </div>
          <span class="fx-chip idchip" id="idchip"></span>
        </div>

        <!-- ph2: the split -->
        <div class="split" id="split">
          <div class="stitle" id="stitle"></div>
          <div class="sbar" id="sbar"></div>
          <div class="slegend" id="slegend"></div>
          <div class="sumrow"><span class="sumlbl">sums to</span><span class="fx-chip sumchip" id="sumchip"></span><span class="fx-chip methodchip" id="methodchip"></span></div>
          <div class="faceoff" id="faceoff">
            <div class="fo sink" id="foSink"><span class="fopct" id="foSinkPct"></span><span class="folbl" id="foSinkLbl"></span><span class="fotok" id="foSinkTok"></span></div>
            <div class="foratio" id="foRatio"></div>
            <div class="fo ans" id="foAns"><span class="fopct" id="foAnsPct"></span><span class="folbl" id="foAnsLbl"></span><span class="fotok" id="foAnsTok"></span></div>
          </div>
        </div>
      </div>
    </div>
    <script src="at-padded-note.js"></script>
  </body>
</html>
