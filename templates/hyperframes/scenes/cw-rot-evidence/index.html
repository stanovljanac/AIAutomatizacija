<!doctype html>
<!--
  cw-rot-evidence — 022 long s16 (phase 1) + s17 (phase 2). Two published measurements, each spoken
  in the PAST TENSE about the models that were tested (sources.md #9/#10) and each with its own
  permanent source chip. No vendor logos, no model names — the count is the fact, and names age.
  ph1  eighteen model chips; as input length is scaled the accuracy bars become UNEVEN and trend
       down — all eighteen, in a ripple. The limit marker sits far to the RIGHT of where the sagging
       started, and a gold bracket spans the gap: it degrades long before the wall.
  ph2  thirteen bars at their own short-input baseline, a 50% line drawn across, input scaled to 32k,
       eleven fall below the line and are counted off in gold. Two survivors stay above.
  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":556},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":18.52}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-rot-evidence.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-rot-evidence" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="grid18" id="grid18"></div>
        <div class="slider" id="slider"><div class="track"></div><div class="knob" id="knob"></div><div class="slbl" id="slbl"></div></div>
        <div class="limit" id="limit"><span class="lline"></span><span class="llbl" id="llbl"></span></div>
        <div class="bracket" id="bracket"><span class="blbl" id="blbl"></span></div>

        <div class="bars13" id="bars13"></div>
        <div class="halfline" id="halfline"><span class="hlbl" id="hlbl"></span></div>
        <div class="tally fx-num" id="tally"></div>

        <div class="fx-chip chip" id="chip"></div>
        <div class="kicker fx-h2" id="kicker"></div>
      </div>
    </div>
    <script src="cw-rot-evidence.js"></script>
  </body>
</html>
