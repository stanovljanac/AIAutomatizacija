<!doctype html>
<!--
  at3d-handout — 023 long s5 (3D). The mechanism, made physical.

  Five real pages stand on the desk with readable text on them. First the picture everyone carries is
  staged and rejected: a beam sweeps the row looking for "what is important" and there is nothing for
  it to switch off. Then the true one is built — a stack of gold chips that IS the total, dealt out
  across the pages until the stack is EMPTY, because the model cannot write the next word until the
  last chip is placed. Then "Every word. From scratch.": the chips are swept up and dealt again,
  faster, with the word counter ticking.

  Pages stand FACE-ON (no resting 3D tilt); the depth comes from the chips, the shadows and the
  camera, not from tipping the panels.

  b0  0.0   the row of pages, already there
  b1  b1    the beam sweeps and finds nothing to turn off — struck
  b2  b2    the stack of chips arrives: the fixed sum
  b3  b3    it is dealt out, completely, before anything can be written
  b4  b4    swept up and dealt again — every word, from scratch

  Seek-driven and deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,
  durationSeconds,revealsSeconds[],props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":482},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":16.06}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-three.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="at3d-handout.css" />
    <script>
      window.__THREE_URL = "./vendor/three.module.min.js";
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="at3d-handout" data-start="0" data-width="1920" data-height="1080">
      <canvas id="gl" data-layout-ignore></canvas>

      <div class="mythwrap" id="mythwrap">
        <div class="fx-myth" id="myth"></div>
        <span class="fx-slash" id="slash"></span>
      </div>

      <div class="sumchip" id="sumchip"><span class="slbl">the total</span><span class="sval fx-mono" id="sval"></span></div>

      <div class="wordrow" id="wordrow">
        <span class="wlbl">writing:</span><span class="wval" id="wval"></span><span class="wcnt fx-mono" id="wcnt"></span>
      </div>

      <div class="kicker" id="kicker"><span class="fx-gold" id="kickertext"></span></div>
    </div>
    <script src="at3d-handout.js"></script>
  </body>
</html>
