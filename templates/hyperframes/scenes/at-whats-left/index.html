<!doctype html>
<!--
  at-whats-left — 023 long s12. The pivot, and it must not be a title card.

  The budget bar returns with a quarter of it already fenced off and labelled as spent on a word that
  means nothing. The camera pushes into the REMAINDER — the part your content has to share — while
  the pile of pages waiting to be paid stacks up underneath it. The question is asked inside that
  shrinking space, not on a background.

  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":230},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":7.67}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="at-whats-left.css" />
  </head>
  <body>
    <div id="root" data-composition-id="at-whats-left" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="budget" id="budget">
          <div class="btrack">
            <div class="spent" id="spent"><span class="slbl" id="spentlbl"></span></div>
            <div class="left" id="left"><span class="llbl" id="leftlbl"></span></div>
            <div class="bedge"></div>
          </div>
        </div>

        <div class="claimants" id="claimants"></div>

        <div class="question" id="question"></div>
      </div>
    </div>
    <script src="at-whats-left.js"></script>
  </body>
</html>
