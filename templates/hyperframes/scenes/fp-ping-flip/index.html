<!doctype html>
<!--
  fp-ping-flip — HyperFrames HOOK HERO for video 017, s1 ("Everyone thinks an AI agent just
  watches a page for changes."). Thesis-first flip landed by the end of sentence 2. SCRAPER POV:
  a kinetic radar beam sweeps a flat synthetic webpage and spits raw diff pings that stack
  gold-on-black — "changed", "changed", "changed" — dumb and relentless. On "That's a scraper —
  not an agent" the whole ping-swarm FREEZES and desaturates to a gray wall (watching alone is
  worthless). On "an agent decides which change actually matters" the gray pings funnel into a
  single gold AGENT node (an eye-into-brain glyph); it lights exactly ONE ping gold and flicks
  the rest away — DECIDE made literal. Anchor pill: "Scraper ≠ agent".

  PALETTE: black + gold (hook/hero). All labels SYNTHETIC. Flat, face-on, no 3D tilt.
  Silent + deterministic: NO Math.random / Date.now; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
  make-entry.mjs patches the exact geometry/duration into a disposable render entry.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1080},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1920},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":302},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":10.07}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <link rel="stylesheet" href="fp-ping-flip.css" />
  </head>
  <body>
    <div id="root" data-composition-id="fp-ping-flip" data-start="0" data-width="1080" data-height="1920">
      <div class="bg" data-layout-ignore>
        <div class="grid"></div>
        <div class="glow" id="glow"></div>
      </div>

      <div class="camera" id="camera">
        <!-- the watched page (flat, face-on, synthetic wireframe) -->
        <div class="page" id="page">
          <div class="pagebar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="url">vendor.example/terms</span></div>
          <div class="pbody">
            <div class="ln w80"></div>
            <div class="ln w95"></div>
            <div class="ln w70"></div>
            <div class="ln w90"></div>
            <div class="ln w60"></div>
            <div class="ln w85"></div>
          </div>
          <div class="sweep" id="sweep"></div>
        </div>

        <!-- the raw diff pings (the scraper's output) -->
        <div class="pings" id="pings">
          <div class="ping" data-k="0">changed <b>· ¶2</b></div>
          <div class="ping" data-k="1">changed <b>· §1.4</b></div>
          <div class="ping" data-k="2">changed <b>· footer</b></div>
          <div class="ping" data-k="3">changed <b>· ¶7</b></div>
          <div class="ping" data-k="4">changed <b>· §3.1</b></div>
          <div class="ping" data-k="5">changed <b>· header</b></div>
          <div class="ping" data-k="6">changed <b>· ¶12</b></div>
          <div class="ping" data-k="7">changed <b>· §6.2</b></div>
          <div class="ping" data-k="8">changed <b>· ¶4</b></div>
          <div class="ping" data-k="9">changed <b>· §2.8</b></div>
          <div class="ping" data-k="10">changed <b>· ¶9</b></div>
          <div class="ping gold" id="theOne">changed <b>· §9 REFUNDS</b></div>
        </div>

        <!-- the AGENT node (eye-into-brain glyph) the pings funnel into -->
        <div class="agent" id="agent">
          <svg viewBox="0 0 96 96" class="aglyph">
            <circle cx="48" cy="48" r="42" class="a-ring" />
            <path d="M18 48 C30 30, 66 30, 78 48 C66 66, 30 66, 18 48 Z" class="a-eye" />
            <circle cx="48" cy="48" r="11" class="a-iris" />
          </svg>
          <div class="alabel">AGENT</div>
        </div>
        <div class="flash" id="flash"></div>

        <div class="anchor" id="anchor"><span class="adot"></span>Scraper&nbsp;<span class="neq">≠</span>&nbsp;agent</div>
      </div>
    </div>
    <script src="fp-ping-flip.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["fp-ping-flip"] = tl;
    </script>
  </body>
</html>
