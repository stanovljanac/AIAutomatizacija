<!doctype html>
<!--
  at3d-hook-v11 — 023 long s1, HOOK HERO (3D). The V1.1 replacement for at3d-hook.

  WHY IT WAS REBUILT (owner review of the 023 cut, 2026-08-23). The first hook opened already INSIDE
  the prompt box at 80% frame fill and grew past both edges, so for the whole beat the viewer saw an
  unlabelled wall of grey text and could not tell WHAT the object was while the narration was already
  attacking. On top of that the gold kicker printed straight over lit 3D text with only a 10%-centre
  radial scrim under it, and the struck myth was left parked at opacity 0.24 — three things competing
  in the same square inch with no focal hierarchy.

  THE FIX, in three rules this scene obeys literally:
    1. ESTABLISH BEFORE YOU ATTACK. Frame 1 is a whole, recognisable AI chat — title strip, two
       message bubbles, an input box with a caret — at 54% frame fill. The camera pushes to at most
       66%, so THE WINDOW'S EDGES ARE VISIBLE IN EVERY FRAME. The wall of text is now something that
       happens INSIDE a thing you already recognise.
    2. ONE LIT OBJECT PER BEAT. The paste floods, then it drops to 22% and defocuses so the thin
       reply can land alone in a pool of light. The comparison is built into the chat itself — the
       GOOD short answer is still up there at the top of the scroll — so no ghost card, no labels.
    3. FLAT TYPE ALWAYS GETS AN OPAQUE PLATE, and what is killed leaves at 0. The myth sits on a
       solid band, the kicker sits on its own plate, and both exit completely.

  Also fixed: the budget bar now hands over at the geometry s2 (at-budget-bar) actually opens on —
  left/right 120px, top 196px, 62px tall. The old hook parked it at 160/636/56, so the "carry" it
  claimed in its scene-plan direction was really a jump cut on the video's spine object.

  b0  0.0   a real chat, then the paste floods it — the window never moves, the content does
  b1  b1    the flood dims and defocuses; the thin reply lands alone, lit
  b2  b2    "Everyone calls that losing focus" — an OPAQUE myth band + the spotlight cone
  b3  b3    the slash; the cone collapses into the budget bar at s2's geometry; the kicker lands

  Seek-driven and deterministic (window.__hfThreeTime + `hf-seek`, no rAF/Date.now, no Math.random).
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,revealsSeconds[],props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":344},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":11.4667}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-three.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="at3d-hook-v11.css" />
    <script>
      // rewritten to ../vendor/… by _lib/make-entry.mjs for the generated entry
      window.__THREE_URL = "./vendor/three.module.min.js";
    </script>
  </head>
  <body>
    <div id="root" class="pal-hero" data-composition-id="at3d-hook-v11" data-start="0" data-width="1920" data-height="1080">
      <canvas id="gl" data-layout-ignore></canvas>

      <!-- a FLAT darkener, not a radial gradient: the old one only dimmed the centre by 10%, which
           is exactly where the type lands. Anything printed over the room rides on top of this. -->
      <div class="scrim" id="scrim"></div>

      <div class="mythwrap" id="mythwrap">
        <div class="cone" id="cone"></div>
        <div class="mythband">
          <div class="fx-myth mythtext" id="myth"></div>
          <span class="fx-slash" id="slash"></span>
        </div>
      </div>

      <!-- THE BUDGET BAR — the spine object, at the geometry s2/at-budget-bar opens on. -->
      <div class="budget" id="budget">
        <div class="btrack">
          <div class="bfill" id="bfill"></div>
          <div class="bedge"></div>
        </div>
        <div class="blbl"><span id="blbltext"></span><span class="bone">1.0000000</span></div>
      </div>

      <div class="kicker" id="kicker"><span class="fx-gold" id="kickertext"></span></div>
    </div>
    <script src="at3d-hook-v11.js"></script>
  </body>
</html>
