<!doctype html>
<!--
  nw-ab-contrast — HyperFrames MONEY SHOT for 019 Short, s3. ONE shared, legible frame (Gate-1
  note: must be one visual, not two scenes or narrated abstraction; proof-must-be-visible).
  ("Watch it build two answers the same way. Ask an easy one — word after word, correct. Ask
   something it never learned — same smooth motion, but the words are invented. Same engine,
   same confidence. One's true, one's made up — and nothing inside can tell them apart.")

  A SINGLE gold CONFIDENCE meter pinned at 100% the ENTIRE beat — it never moves. Below it a clean
  vertical split, the SAME word-by-word engine feeding BOTH sides at identical cadence:
    LEFT  (easy Q)         "Water boils at 100°C"          → green ✓
    RIGHT (never-learned)  "The Zephyr Prize began in 1938" → red ✗   (synthetic falsehood)
  A bracket ties both sides to the one meter; a gold underline "measures fluency, not truth"
  seeds s4. Hold ≥4s. Flat, face-on, no 3D tilt. SYNTHETIC data only. Silent + deterministic.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1080},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1920},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":546},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":18.2}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="nw-ab-contrast.css" />
  </head>
  <body>
    <div id="root" data-composition-id="nw-ab-contrast" data-start="0" data-width="1080" data-height="1920">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="glow" id="glow"></div></div>

      <div class="camera" id="camera">
        <!-- the ONE shared CONFIDENCE meter, pinned 100% the entire beat -->
        <div class="meter" id="meter">
          <div class="mtop"><span class="mlabel">CONFIDENCE</span><span class="mval">100%</span></div>
          <div class="mtrack"><div class="mfill"></div></div>
          <div class="munder" id="munder">measures fluency, not truth</div>
        </div>

        <!-- the bracket tying both sides to the one meter -->
        <svg class="bracket" id="bracket" viewBox="0 0 1000 120" preserveAspectRatio="none">
          <path id="bpath" d="M230 110 L230 40 L770 40 L770 110" />
          <path id="bstem" d="M500 40 L500 6" />
        </svg>
        <div class="sameengine" id="sameengine">same engine · same confidence</div>

        <!-- the vertical split -->
        <div class="split" id="split">
          <div class="col" id="colL">
            <div class="chead easy">Easy question</div>
            <div class="ans" id="ansL">
              <span class="w">Water</span> <span class="w">boils</span> <span class="w">at</span> <span class="w">100°C</span><span class="caret cL" id="caretL"></span>
            </div>
            <div class="verdict good" id="vL">✓ true</div>
          </div>
          <div class="divider" id="divider"></div>
          <div class="col" id="colR">
            <div class="chead never">Never learned</div>
            <div class="ans" id="ansR">
              <span class="w">The</span> <span class="w">Zephyr</span> <span class="w">Prize</span> <span class="w">began</span> <span class="w">in</span> <span class="w">1938</span><span class="caret cR" id="caretR"></span>
            </div>
            <div class="verdict bad" id="vR">✗ invented</div>
          </div>
        </div>
      </div>
    </div>
    <script src="nw-ab-contrast.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["nw-ab-contrast"] = tl;
    </script>
  </body>
</html>
