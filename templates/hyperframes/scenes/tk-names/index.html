<!doctype html>
<!--
  tk-names — 021 long, s6. THE HUMAN BEAT (blue+gold; warm, never clinical).
  Three name cards land in rhythm, one per sentence, each splitting into its MEASURED chunks
  ( Sarah = 1 · " Ok|onk|wo" = 3 · " Kow|als|ki" = 3). Same type size, same weight, same position —
  only the NUMBER OF PIECES differs, so the eye reads the difference instantly. On the last sentence
  the three cards sit level together and a single gold underline runs beneath all three reading
  "frequency, not merit". Deliberately no ranking, no red, no alarm: an observation, not a complaint.

  Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":258},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":8.6}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="tk-names.css" />
  </head>
  <body>
    <div id="root" data-composition-id="tk-names" data-start="0" data-width="1920" data-height="1080">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="glow" id="glow"></div></div>
      <div class="row" id="row"></div>
      <div class="underwrap" id="underwrap">
        <span class="under" id="under"></span>
        <span class="underlabel" id="underlabel"></span>
      </div>
      <div class="chip" id="chip"></div>
    </div>
    <script src="tk-names.js"></script>
  </body>
</html>
