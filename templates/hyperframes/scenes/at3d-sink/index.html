<!doctype html>
<!--
  at3d-sink — 023 long s10 (3D). The naming beat, and the strongest image in the video.

  A real till drawer stands on the desk, one labelled compartment per token. The shares that DO
  belong to the text are counted out into their own slots — a few coins each. Then the leftover,
  the change nobody asked for, is poured into the FIRST slot, which is just the nearest hole: it
  fills to the brim while every other compartment sits nearly empty. The name lands as an in-scene
  plate that takes the depth of field; the source chip stays flat DOM.

  b0  the drawer, already open
  b1  the name: "the attention sink"
  b2  the rule that causes it — the total has to come to one
  b3  the leftovers have to go somewhere harmless
  b4  they are dumped on whatever came first
  b5  "It isn't interested. It's making change."

  Seek-driven and deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,
  durationSeconds,revealsSeconds[],props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":750},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":25.0}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-three.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="at3d-sink.css" />
    <script>
      window.__THREE_URL = "./vendor/three.module.min.js";
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="at3d-sink" data-start="0" data-width="1920" data-height="1080">
      <canvas id="gl" data-layout-ignore></canvas>

      <div class="namewrap" id="namewrap">
        <div class="name" id="name"></div>
        <span class="fx-chip src" id="src"></span>
      </div>

      <div class="rule" id="rule"><span class="rlbl">the rule</span><span class="rval fx-mono">shares must sum to 1</span></div>

      <div class="kicker" id="kicker"><span class="fx-gold" id="kickertext"></span></div>
    </div>
    <script src="at3d-sink.js"></script>
  </body>
</html>
