<!doctype html>
<!--
  cw-measured-run — the spine of the video: the measurement, SHOWN as a run, not narrated.
  022 long s5 (ph1) · s6 (ph2) · s7 (ph3), and 022 Short s3 (ph4, portrait).

  Every number on this chart is real and reproducible (measure/measure.py, tiktoken o200k_base,
  2026-08-16): 154 · 215 · 279 · 366 · 433 · 489 · 548 · 606 sent, 680 said, 3,090 read, 4.54x.
  Nothing here may be invented or rounded for looks — the whole episode rests on this one chart.

  ph1 (s5)  the synthetic thread scrolls past, ordinary and unremarkable; a counter chip assembles
  ph2 (s6)  eight bars snap in on their own beats, numbers ticking up, a pile growing beside them
  ph3 (s7)  the bars stack into ONE column (3,090) next to the conversation (680), TRUE to scale
  ph4 (Short s3) the same run, its own vertical cut: bars → the two columns → 4.5x

  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":504},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":16.8}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-measured-run.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-measured-run" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <!-- ph1: the ordinary chat we measured -->
        <div class="ribbonclip" id="ribbonclip"><div class="ribbon" id="ribbon"></div></div>
        <div class="counter" id="counter"></div>

        <!-- ph2: the run -->
        <div class="chart" id="chart"></div>
        <div class="axis" id="axis"></div>
        <div class="pileside" id="pileside"></div>

        <!-- ph3: what it adds up to -->
        <div class="cols" id="cols">
          <div class="col said" id="colSaid"><div class="colbar" id="barSaid"></div><div class="colnum fx-num" id="numSaid"></div><div class="collbl" id="lblSaid"></div></div>
          <div class="ratio fx-gold fx-num" id="ratio"></div>
          <div class="col read" id="colRead"><div class="colbar" id="barRead"></div><div class="colnum fx-num" id="numRead"></div><div class="collbl" id="lblRead"></div></div>
        </div>

        <div class="chip fx-chip" id="chip"></div>
      </div>
    </div>
    <script src="cw-measured-run.js"></script>
  </body>
</html>
