<!doctype html>
<!--
  cw-never-remembered — 022 long, s1 (HOOK HERO, black+gold).

  STRATEGIC PREMISE (MOTION_SPEC §0): the strongest opening for "it never remembered" is to make the
  viewer watch their OWN long chat scroll away and then come back to find the one line they care about
  simply not there. Absence, not deletion — nothing is crossed out, nothing is deleted on screen; the
  slot is just empty. Then the myth is named ("it forgot"), struck, and the whole thread collapses into
  the object the rest of the video runs on: THE PILE.

  b0  0.0s   we are already mid-thread, scrolling — no runway, the opening frame IS the first reveal
  b0' 3.9s   the view returns to the top of the thread; the pinned page is gone, its slot empty
  b1  5.6s   "Everyone calls that forgetting" — the gray myth plate rises
  b2  7.6s   "It didn't forget" — the gold slash
  b3  8.8s   the thread collapses into ONE pile of paper that lands with weight (the spine object)

  Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":335},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":11.17}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-never-remembered.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-never-remembered" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="threadclip" id="threadclip">
          <div class="thread" id="thread"></div>
        </div>

        <div class="mythwrap" id="mythwrap">
          <div class="fx-myth" id="myth"></div>
          <span class="fx-slash" id="slash"></span>
        </div>

        <div class="pilehost" id="pilehost"></div>
        <div class="impact" id="impact"></div>

        <div class="kicker" id="kicker"><span class="fx-gold" id="kickertext"></span></div>
      </div>
    </div>
    <script src="cw-never-remembered.js"></script>
  </body>
</html>
