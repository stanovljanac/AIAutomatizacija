<!doctype html>
<!--
  ats-budget-spill — 023 SHORT s1 (hook hero, black+gold, PORTRAIT).

  Must land inside 3s on a swipe, and it opens ON the object the viewer recognises: their own pasted
  note, readable, filling the middle of a 9:16 frame. The total sits above it, already full. Then it
  SPILLS: the bar empties downward into the words and more than half of it piles onto the very first
  word — "Notes" — which swells while every other word gets a sliver. The counter only runs as the
  share lands. On "I measured it" the instrument readout stamps in underneath.

  Portrait is its own composition, not a crop: the note + token row carry ~60% of frame height.

  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1080},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1920},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":270},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":9.0}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="ats-budget-spill.css" />
  </head>
  <body>
    <div id="root" data-composition-id="ats-budget-spill" data-start="0" data-width="1080" data-height="1920">
      <div id="world" class="fx-world">
        <div class="budget" id="budget">
          <div class="btrack"><div class="bfill" id="bfill"></div><div class="bedge"></div></div>
          <div class="blbl"><span>the total it hands out</span><span class="fx-mono">1.0000000</span></div>
        </div>

        <div class="note" id="note"></div>

        <div class="tokrow" id="tokrow"></div>

        <div class="headline" id="headline">
          <span class="hbig fx-num" id="hbig">0%</span>
          <span class="hlbl" id="hlbl"></span>
        </div>

        <div class="readout fx-mono" id="readout"></div>
      </div>
    </div>
    <script src="ats-budget-spill.js"></script>
  </body>
</html>
