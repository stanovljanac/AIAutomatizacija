<!doctype html>
<!--
  magnifier-notfound — HyperFrames scene for the 010 Short (s2). A single authoritative citation; a
  magnifier sweeps across it and a functional red NOT FOUND stamp slams down. BLACK + GOLD; the only
  alarm imagery is the functional stamp. Synthetic/illustrative citation. Silent + deterministic;
  seek-driven; beats = sentences. Portrait-first (also 16:9).

  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,revealsSeconds[],props{ stampLabel? }
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1080},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1920},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":180},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":6}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <link rel="stylesheet" href="magnifier-notfound.css" />
  </head>
  <body>
    <div id="root" data-composition-id="magnifier-notfound" data-start="0" data-width="1080" data-height="1920">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="flash" id="flash"></div></div>
      <div class="stage" id="stage">
        <div class="card" id="card">
          <div class="cite" id="cite">Marbrook v. Halsey, 288 F.3d 104</div>
          <div class="underline" id="underline"></div>
          <div class="magnifier" id="magnifier" data-layout-ignore>⌕</div>
          <div class="stamp" id="stamp" data-layout-ignore><span id="stamp-text">NOT FOUND</span></div>
        </div>
        <div class="sub" id="sub">no such case exists</div>
      </div>
    </div>
    <script src="magnifier-notfound.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["magnifier-notfound"] = tl;
    </script>
  </body>
</html>
