<!doctype html>
<!--
  cw-tower — 022 Short s2, the MECHANISM in 9:16. Replaces cw-desk-cycle phase 2.

  WHY IT WAS REBUILT (owner, 2026-08-17): the portrait cut inherited the long scene's wipe, so the
  Short spent five seconds on an empty desk under live narration — and an 11-page stack is 242px of
  a 1920-tall frame, a thin strip on a phone. Vertical format rewards growth UPWARD, so this cut
  never deletes anything: the whole tower LIFTS off the desk (that separation is "between two
  messages it holds nothing" — emptiness shown as a gap, not as a deletion), is read while it hangs
  there, gains a page, and drops back. The camera pulls back only as far as it must to keep the
  tower in frame, so the tower visibly outgrows the shot: ~47% of frame height on turn 1, ~60% by
  turn 4, and the counter beside it climbs 154 → 606.

  BEATS (revealsSeconds)
    b0  "Between two messages it holds nothing."   the tower lifts; bare desk opens underneath
    b1  "Every time you hit send, the whole        the cycle runs and accelerates in rhythm while
         conversation goes back in…"               the tower grows and the count climbs

  The counter block lives OUTSIDE #world on purpose: the camera pull must never scale it out of
  frame, and a late-appearing number gets its own reserved space (MOTION_SPEC §0).

  Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,revealsSeconds[],props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1080},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1920},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":325},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":10.83}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-tower.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-tower" data-start="0" data-width="1080" data-height="1920">
      <!-- reserved space, outside the camera rig -->
      <div class="head" id="head">
        <div class="chip fx-chip" id="chip"></div>
        <div class="num fx-num fx-gold" id="num">0</div>
        <div class="numlbl" id="numlbl"></div>
      </div>

      <div id="world" class="fx-world">
        <div class="deskhost" id="deskhost"></div>
        <!-- the bare desk that opens up while the tower hangs above it -->
        <div class="bare" id="bare"></div>
        <div class="towerhost" id="towerhost"></div>
        <div class="sweephost" id="sweephost"></div>
        <div class="impact" id="impact"></div>
      </div>
    </div>
    <script src="cw-tower.js"></script>
  </body>
</html>
