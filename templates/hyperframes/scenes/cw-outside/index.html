<!doctype html>
<!--
  cw-outside — 022 long s20 (phase 1) + s24 (phase 2). Both scenes make the SAME structural point,
  which is why they share a file: whatever does the remembering is OUTSIDE the desk.
  ph1  the objection in the viewer's own words is conceded, not dismissed: a drawer sits clearly
       outside the frame, a note flies out of it and lands as the FIRST page of a fresh, empty pile.
       The desk still gets wiped between turns.
  ph2  three mechanisms work, visibly — a summariser folding pages into one, a retriever pulling a
       single page off a shelf, a memory file handing over a note — and the pile really does shrink.
       Then the camera pulls back and every one of them is outside the gold frame, feeding it.
  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":476},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":15.88}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-outside.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-outside" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="frame" id="frame"><span class="flbl" id="flbl"></span></div>
        <div class="deskhost" id="deskhost"></div>
        <div class="pilehost" id="pilehost"></div>

        <div class="drawer" id="drawer"><span class="dlbl" id="dlbl"></span><span class="pull"></span></div>
        <div class="note" id="note"><span id="notetext"></span></div>

        <div class="mech m1" id="m1"><div class="mico" id="i1"></div><span class="mlbl" id="l1"></span></div>
        <div class="mech m2" id="m2"><div class="mico" id="i2"></div><span class="mlbl" id="l2"></span></div>
        <div class="mech m3" id="m3"><div class="mico" id="i3"></div><span class="mlbl" id="l3"></span></div>

        <div class="kicker fx-h2" id="kicker"></div>
      </div>
    </div>
    <script src="cw-outside.js"></script>
  </body>
</html>
