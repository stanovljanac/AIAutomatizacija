<!doctype html>
<!--
  pipeline-recap — 012 s14 (blue+gold body). The whole employee on one canvas: 11 nodes in a
  serpentine flow, three glowing TERRITORY fields (DRAFT / CHECK / GATE — fields of light, never
  an icon strip), and one gold token that flows end to end, HALTING at both human gates.
  This diagram is the Short's centerpiece. Silent + deterministic; seek-driven; beats = sentences (3).

  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,revealsSeconds[],props{}
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":450},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":15}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <link rel="stylesheet" href="pipeline-recap.css" />
  </head>
  <body>
    <div id="root" data-composition-id="pipeline-recap" data-start="0" data-width="1920" data-height="1080">
      <div class="bg" data-layout-ignore><div class="grid-bg"></div></div>
      <div class="stage">
        <div class="field draft" id="fDraft" style="left:3%;top:6%;width:26%;height:36%"><span class="f-label">DRAFT</span></div>
        <div class="field check" id="fCheck1" style="left:31%;top:6%;width:32%;height:36%"><span class="f-label">CHECK</span></div>
        <div class="field gate" id="fGate1" style="left:65%;top:6%;width:16%;height:36%"><span class="f-label">GATE</span></div>
        <div class="field check second" id="fCheck2" style="left:22%;top:50%;width:16%;height:36%"></div>
        <div class="field gate second" id="fGate2" style="left:6%;top:50%;width:14%;height:36%"></div>

        <div class="node" id="n1" style="left:7%;top:18%"><span class="n-ico">💡</span><span class="n-label">idea</span></div>
        <div class="node" id="n2" style="left:19%;top:18%"><span class="n-ico">✍</span><span class="n-label">draft</span></div>
        <div class="node chk" id="n3" style="left:35%;top:18%"><span class="n-ico">✕</span><span class="n-label">reviewer</span></div>
        <div class="node chk" id="n4" style="left:49%;top:18%"><span class="n-ico">⚖</span><span class="n-label">fact-check</span></div>
        <div class="node gatenode" id="n5" style="left:68.3%;top:18%"><span class="n-ico">🖐</span><span class="n-label">MY DESK</span></div>
        <div class="node" id="n6" style="left:86%;top:18%"><span class="n-ico">〜</span><span class="n-label">voice</span></div>
        <div class="node" id="n7" style="left:86%;top:62%"><span class="n-ico">⌗</span><span class="n-label">scenes</span></div>
        <div class="node" id="n8" style="left:70%;top:62%"><span class="n-ico">▦</span><span class="n-label">render</span></div>
        <div class="node chk" id="n9" style="left:26%;top:62%"><span class="n-ico">◉</span><span class="n-label">QA</span></div>
        <div class="node gatenode" id="n10" style="left:8.3%;top:62%"><span class="n-ico">🖐</span><span class="n-label">MY DESK</span></div>
        <div class="node pub" id="n11" style="left:47%;top:80%"><span class="n-ico">▶</span><span class="n-label">publish</span></div>

        <div class="token" id="token"></div>
        <div class="tally" id="tally"><span class="t-gold">2 GATES</span><span class="t-dot">·</span><span class="t-green">3 CHECKERS</span><span class="t-dot">·</span><span class="t-blue">1 VOICE</span></div>
      </div>
    </div>
    <script src="pipeline-recap.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["pipeline-recap"] = tl;
    </script>
  </body>
</html>
