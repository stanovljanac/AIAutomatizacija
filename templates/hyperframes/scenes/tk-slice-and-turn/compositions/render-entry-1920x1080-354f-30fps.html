<!doctype html>
<!--
  tk-slice-and-turn — 021 long, s2 (phase 1) + s3 (phase 2). ONE file, two phases, so the citation
  plate and the capsule row survive the s2→s3 boundary at exactly the same size and position
  (D-060 `carry`: the compositor cannot align two independently rendered clips — the AUTHOR does).

  PHASE 1 (s2, CORRECTION BEAT + ANSWER-FIRST, blue+gold)
    b0  the Desk Lessons correction motif tag — a small gold tag, never a title card
    b1  "your text is cut into pieces" — the typed line visibly SLICES into capsules
    b2  the rule of thumb arrives as a gray citation plate + source chip
    b3  "That's accurate." — a GREEN TICK lands on it. It is deliberately NOT struck through.

  PHASE 2 (s3, THE TURN) — opens with the plate ALREADY on screen, no reset
    b0  the gray ghost model slides into the centre: "token = small word"
    b1  "It isn't a word." — the gold slash strikes it through
    b2  the capsules re-form in the SAME position the ghost occupied and glow gold; one capsule is
        left centred for the MATCH CUT into s4.

  Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":465},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":15.5}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="../tk-slice-and-turn.css" />
  </head>
  <body>
    <div id="root" data-composition-id="tk-slice-and-turn" data-start="0" data-duration="11.783333333333333" data-width="1920" data-height="1080">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="glow" id="glow"></div></div>

      <div class="motif" id="motif"></div>

      <!-- the line that gets cut -->
      <div class="linewrap" id="linewrap"><div class="line" id="line"></div></div>

      <!-- the rule of thumb — quoted, sourced, and NOT contradicted -->
      <div class="plate" id="plate">
        <div class="rule" id="rule"></div>
        <div class="platefoot">
          <span class="chip" id="chip"></span>
          <span class="tick" id="tick">✓</span>
        </div>
      </div>

      <!-- phase 2: the wrong mental model, and the right one taking its place -->
      <div class="ghostwrap" id="ghostwrap">
        <span class="ghost" id="ghost"></span>
        <span class="slash" id="slash"></span>
      </div>
      <div class="rightwrap" id="rightwrap"><div class="line right" id="rightline"></div></div>
      <div class="rightlabel" id="rightlabel"></div>
    </div>
    <script src="../tk-slice-and-turn.js"></script>
  </body>
</html>
