<!doctype html>
<!--
  fp-kept-judgment — HyperFrames scene for video 017, s4 KEPT JUDGMENT ("This is what makes it
  an agent, not an alarm."). The honest catch opens DIRECTLY on the limitation — no announce.
  The DECISION CARD from s3 shrinks to a compact reference at the top. Three small gray
  change-chips (new logo / fixed typo / reworded intro, of "six that day") appear and the agent
  stamps each one "IGNORED · cosmetic" — the DISCRIMINATION made visible (it read them and chose
  silence, unlike the s2 scraper); a quiet "alerts sent: 0" tally lands. On "won't act on that
  either" a row of actions it COULD have auto-taken — Cancel plan / Switch vendor / Email legal —
  appears grayed, slashed, LOCKED (it refuses to act). On "hands the call to you" the HIGH card
  slides to a gold YOU node (open hand) where an Approve / Dismiss pair lights up — the decision
  handed over, not taken. Quotable stamp lands and holds: "It flags. You decide."

  PALETTE: blue+gold shifting to black+gold on the handover. Flat, face-on, no 3D tilt.
  Silent + deterministic: NO Math.random / Date.now; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1080},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1920},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":660},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":22.0}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <link rel="stylesheet" href="fp-kept-judgment.css" />
  </head>
  <body>
    <div id="root" data-composition-id="fp-kept-judgment" data-start="0" data-width="1080" data-height="1920">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="darken" id="darken"></div><div class="glow" id="glow"></div></div>

      <div class="camera" id="camera">
        <!-- the s3 decision card, shrunk to a compact reference -->
        <div class="refcard" id="refcard">
          <span class="refchip">Acme Pay</span>
          <span class="reftext">Refund 30 → <b>14 days</b></span>
          <span class="refhigh">HIGH</span>
        </div>

        <!-- the six-other-changes tally + the three ignored chips -->
        <div class="ignored" id="ignoredwrap">
          <div class="six" id="six">that day: <b>6 more changes</b></div>
          <div class="chiprow">
            <div class="cchip" id="c1"><span class="cname">new logo</span><span class="cstamp" id="st1">IGNORED · cosmetic</span></div>
            <div class="cchip" id="c2"><span class="cname">fixed typo</span><span class="cstamp" id="st2">IGNORED · cosmetic</span></div>
            <div class="cchip" id="c3"><span class="cname">reworded intro</span><span class="cstamp" id="st3">IGNORED · cosmetic</span></div>
          </div>
          <div class="zero" id="zero"><span class="zdot"></span>alerts sent: <b>0</b></div>
        </div>

        <!-- the actions it refuses to take -->
        <div class="actions" id="actions">
          <div class="act" id="a1"><svg viewBox="0 0 24 24" class="lock"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11 V8 a4 4 0 0 1 8 0 v3"/></svg>Cancel plan<div class="slash"></div></div>
          <div class="act" id="a2"><svg viewBox="0 0 24 24" class="lock"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11 V8 a4 4 0 0 1 8 0 v3"/></svg>Switch vendor<div class="slash"></div></div>
          <div class="act" id="a3"><svg viewBox="0 0 24 24" class="lock"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11 V8 a4 4 0 0 1 8 0 v3"/></svg>Email legal<div class="slash"></div></div>
        </div>

        <!-- the handover: HIGH card → YOU node with Approve / Dismiss -->
        <div class="youwrap" id="youwrap">
          <div class="youglyph">
            <svg viewBox="0 0 96 96">
              <circle cx="48" cy="48" r="42" class="y-ring"/>
              <circle cx="48" cy="34" r="12" class="y-head"/>
              <path d="M26 74 C 26 56, 70 56, 70 74" class="y-body"/>
            </svg>
            <div class="youlabel">YOU</div>
          </div>
          <div class="paircol">
            <div class="pbtn approve" id="approve">✓ Approve</div>
            <div class="pbtn dismiss" id="dismiss">✕ Dismiss</div>
          </div>
        </div>

        <!-- the quotable stamp -->
        <div class="quote" id="quote"><span class="q1">It flags.</span> <span class="q2">You decide.</span></div>
      </div>
    </div>
    <script src="fp-kept-judgment.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["fp-kept-judgment"] = tl;
    </script>
  </body>
</html>
