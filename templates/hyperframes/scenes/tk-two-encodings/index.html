<!doctype html>
<!--
  tk-two-encodings — 021 long s12 (phase 1) + s13 (phase 2). ONE file so both rails survive the
  boundary at the same size and position (author-side carry).

  THE ARTIFACT BEAT — this is what guards the whole video against "but mine gets it right": the split
  is a property of ONE tokenizer, not of the word. Both encodings cut strawberry into THREE pieces, so
  the count is not the story — the BOUNDARY is. The two cut-lines are drawn as gold ticks and they
  visibly SLIDE between the rails.

  PHASE 1 (s12) two labelled rails, the same word on both; the older encoding cuts str|aw|berry, the
                current one st|raw|berry; the ticks slide.
  PHASE 2 (s13) the text-river returns BEHIND each rail at a different density (the cause, shown once,
                never explained again), then both rails dim to gray and one gold line lands alone:
                "NO CORRECT WAY TO CUT A WORD." — the second screenshotable frame of the video.

  Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":412},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":13.72}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="tk-two-encodings.css" />
  </head>
  <body>
    <div id="root" data-composition-id="tk-two-encodings" data-start="0" data-width="1920" data-height="1080">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="glow" id="glow"></div></div>

      <div class="rail" id="railA">
        <div class="river" id="riverA"><div class="rivertrack" id="trackA"></div></div>
        <div class="rl" id="labelA"></div>
        <div class="word" id="wordA"></div>
        <div class="count" id="countA">3</div>
      </div>

      <div class="rail" id="railB">
        <div class="river" id="riverB"><div class="rivertrack" id="trackB"></div></div>
        <div class="rl" id="labelB"></div>
        <div class="word" id="wordB"></div>
        <div class="count" id="countB">3</div>
      </div>

      <div class="line" id="line"></div>
      <div class="caption" id="caption"></div>
      <div class="chip" id="chip"></div>
    </div>
    <script src="tk-two-encodings.js"></script>
  </body>
</html>
