<!doctype html>
<!--
  tk-sealed — the SPINE OBJECT of 021. One file, four phases, so the sealed capsule is literally the
  same object at the same size and position every time it returns (author-side `carry`).

  PHASE "arrive"      (long s7)  the question types itself, the tokenizer runs ON it, and the
                                 strawberry capsule is ONE opaque gold pill. Push INTO it and find a
                                 smooth sealed interior — ten ghost letters try to resolve and fade.
  PHASE "reconstruct" (long s8)  opens on that capsule ALONE. After "never delivered" comes the 1.2s
                                 SCRIPTED PAUSE (D-063): nothing moves but a slow push-in — no sting,
                                 no text, the silence carries it. Then the guessed letters assemble
                                 OUTSIDE the capsule, one visibly uncertain; a green tick and a red
                                 cross land side by side, SAME SIZE. We never claim it always fails —
                                 this frame is the precision guard, rendered.
  PHASE "limit"       (long s21) the workaround genuinely works: the spell-out chain unrolls and the
                                 cross flips to a tick. Then the reframe — the chain is redrawn DOTTED
                                 next to the SOLID capsule (arrived vs reconstructed), and one link
                                 quietly turns wrong under a small gold "?".
  PHASE "short"       (Short s2) the long cut's s7+s8 compressed into one continuous vertical move.

  Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":426},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":14.2}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="../tk-sealed.css" />
  </head>
  <body>
    <div id="root" data-composition-id="tk-sealed" data-start="0" data-duration="18.683333333333334" data-width="1920" data-height="1080">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="glow" id="glow"></div></div>

      <!-- the question, exactly as a human types it -->
      <div class="qwrap" id="qwrap">
        <span class="qtext" id="qtext"></span><span class="caret" id="caret"></span>
        <div class="qcaps" id="qcaps"></div>
      </div>

      <!-- the guessed letters — assembled OUTSIDE the capsule, from memory -->
      <div class="guessrow" id="guessrow"></div>
      <div class="guesslabel" id="guesslabel">reconstructed from memory</div>

      <!-- the spine object -->
      <div class="sealstage" id="sealstage">
        <span class="dot" id="dot"></span>
        <div class="seal" id="seal">
          <span class="sheen" id="sheen"></span>
          <div class="ghosts" id="ghosts"></div>
        </div>
        <div class="seallabel" id="seallabel"></div>
      </div>

      <!-- the two marks: same size, neither dominant -->
      <div class="marks" id="marks">
        <div class="mark ok" id="markok"><span class="glyph" id="okglyph">✓</span><span class="ml" id="oklabel"></span></div>
        <div class="mark no" id="markno"><span class="glyph" id="noglyph">✕</span><span class="ml" id="nolabel"></span></div>
      </div>

      <!-- the spell-out chain (phase limit) -->
      <div class="chainwrap" id="chainwrap">
        <div class="chain" id="chain"></div>
        <div class="chainlabel" id="chainlabel"></div>
      </div>

      <div class="caption" id="caption"></div>
      <div class="chip" id="chip"></div>
    </div>
    <script src="../tk-sealed.js"></script>
  </body>
</html>
