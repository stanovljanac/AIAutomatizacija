<!doctype html>
<!--
  nw-fluency-not-truth — HyperFrames REFRAME / TAKEAWAY for 019 Short, s4 ("That's the trap. Its
  confidence measures how fluent the words sound — not whether they're true. Nothing in a base
  model checks if it's right. So don't trust the tone. Every answer is a guess. Verify it.")
  Blue → black + gold. Screenshotable. Flat, face-on, no 3D tilt.

  BEAT 0  "That's the trap." — the s3 meter reappears small (chip: confidence).
  BEAT 1  the quotable line lands as a HELD gold-on-black stamp: "Confidence measures fluency —
          not truth." and the chip RELABELS confidence → fluency (the mental-model swap, literal).
  BEAT 2  "Nothing in a base model checks if it's right" — a gray fact-check gauge sits at zero /
          absent inside the machine outline; there is no truth dial.
  BEAT 3  "So don't trust the tone" — the WRONG rule appears (gray).
  BEAT 4  "Every answer is a guess. Verify it." — the wrong rule fades; the WORKING rule locks in
          gold+solid: "treat it as a guess → verify" (the node carried into s5).

  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds
  + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1080},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1920},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":399},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":13.3}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="nw-fluency-not-truth.css" />
  </head>
  <body>
    <div id="root" data-composition-id="nw-fluency-not-truth" data-start="0" data-width="1080" data-height="1920">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="glow" id="glow"></div></div>

      <div class="camera" id="camera">
        <!-- the s3 meter, small — relabels confidence → fluency -->
        <div class="relabel" id="relabel">
          <span class="rlabel"><span class="rold" id="rold">confidence</span><span class="rnew" id="rnew">fluency</span></span>
          <span class="rbar"><i></i></span>
          <span class="rval">100%</span>
        </div>

        <!-- the quotable stamp -->
        <div class="quote" id="quote">
          <span class="q1">Confidence measures</span>
          <span class="q2">fluency</span>
          <span class="q3">— not truth.</span>
        </div>

        <!-- the fact-check gauge at zero, inside the machine -->
        <div class="machine" id="machine">
          <div class="mhead">inside a base model</div>
          <div class="gauge">
            <svg viewBox="0 0 220 130" class="gsvg">
              <path class="garc" d="M20 115 A90 90 0 0 1 200 115" />
              <line class="gneedle" id="gneedle" x1="110" y1="115" x2="34" y2="70" />
              <circle class="ghub" cx="110" cy="115" r="8" />
            </svg>
            <div class="glabel">truth check: <b id="gword">none</b></div>
          </div>
        </div>

        <!-- the model swap: wrong rule → working rule -->
        <div class="rules">
          <div class="rule wrong" id="wrongrule"><span class="rx">✕</span> sounds sure = it's right<span class="wstrike" id="wstrike"></span></div>
          <div class="rule work" id="workingrule"><span class="rc">✓</span> treat it as a guess → verify</div>
        </div>
      </div>
    </div>
    <script src="nw-fluency-not-truth.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["nw-fluency-not-truth"] = tl;
    </script>
  </body>
</html>
