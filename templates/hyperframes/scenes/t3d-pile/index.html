<!doctype html>
<!--
  t3d-pile — 022 long s5, the 3D cut of cw-measured-run phase 1 (the set-up for the measurement).

  THE BEAT: "That sounds like a technicality until you count it. So I took an ordinary chat — someone
  cleaning up a messy column of due dates in a spreadsheet — and measured what the model actually
  read." So the scene has to do two things and nothing else: pile up ONE ordinary conversation, page
  by page, and then MEASURE it — a read bar that travels the whole stack, top to bottom, with the
  focal plane riding it down.

  WHAT THE THIRD DIMENSION BUYS HERE: the stack is the object the entire video argues about, and in
  3D it has volume — sixteen real sheets with thickness, each casting a contact shadow on the one
  below, the camera orbiting so you can see how deep it is, and the rack focus following the bar so
  "it read all of this" is something you watch happen rather than a number on a card.

  b0  "That sounds like a technicality until you count it."   the pages start landing on the desk
  b1  "So I took an ordinary chat…"                            the subject stands up beside the stack
      "…and measured what the model actually read."            the bar reads the whole stack

  Seek-driven and deterministic (window.__hfThreeTime + `hf-seek`, HF3.rng seeds, no rAF/Date.now).
  DOF + bloom from _lib/hf-three.js; nothing is vendored beyond the Three.js core build.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,revealsSeconds[],props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":329},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":10.97}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-three.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="t3d-pile.css" />
    <script>
      // rewritten to ../vendor/… by _lib/make-entry.mjs for the generated entry
      window.__THREE_URL = "./vendor/three.module.min.js";
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="t3d-pile" data-start="0" data-width="1920" data-height="1080">
      <canvas id="gl" data-layout-ignore></canvas>
      <div class="counter fx-chip" id="counter"></div>
    </div>
    <script src="t3d-pile.js"></script>
  </body>
</html>
