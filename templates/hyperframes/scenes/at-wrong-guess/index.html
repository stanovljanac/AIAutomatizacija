<!doctype html>
<!--
  at-wrong-guess — 023 long s15. The channel corrected by its own instrument.

  Our prediction is written out as a real hypothesis card with the curve we expected — the fact's
  share falling as the prompt grows. The measured line is then drawn on the same axes and it goes the
  WRONG WAY, up through the prediction, and lands on 0.100. The card is struck, not deleted, and
  stays on screen beside the result. Then the honest mechanism: twelve head lanes, and one of them
  locks onto the rare relevant line and holds it while the others spread out.

  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":535},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":17.83}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="at-wrong-guess.css" />
  </head>
  <body>
    <div id="root" data-composition-id="at-wrong-guess" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="hyp" id="hyp">
          <div class="hlbl">our hypothesis</div>
          <div class="htext" id="htext"></div>
          <div class="hsub" id="hsub"></div>
          <span class="fx-slash hslash" id="hslash"></span>
        </div>

        <div class="plot" id="plot">
          <div class="ptitle" id="ptitle"></div>
          <svg class="psvg" id="psvg" viewBox="0 0 1000 460" preserveAspectRatio="none">
            <path class="grid" d="M0 115 H1000 M0 230 H1000 M0 345 H1000" />
            <path class="pred" id="pred" d="" />
            <path class="meas" id="meas" d="" />
          </svg>
          <span class="pend from" id="pfrom"></span>
          <span class="pend to" id="pto"></span>
          <span class="axis x1">30 tokens</span>
          <span class="axis x2">236 tokens</span>
          <span class="axis y">the fact's share</span>
        </div>

        <div class="heads" id="heads"></div>
        <div class="lesson" id="lesson"></div>
        <div class="verdict fx-h3" id="verdict"></div>
      </div>
    </div>
    <script src="at-wrong-guess.js"></script>
  </body>
</html>
