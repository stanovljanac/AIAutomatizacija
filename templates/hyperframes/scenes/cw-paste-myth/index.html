<!doctype html>
<!--
  cw-paste-myth — 022 long s15 (phase 1) + s18 (phase 2). The advice everybody repeats, and what
  finally kills it. One file so the gray myth plate is literally the same object in both.
  ph1  "just paste it all in" arrives as the gray myth plate and a huge dump of pages overflows the
       desk. NO slash yet — s16/s17 do the striking, with evidence.
  ph2  the plate finally takes the gold slash; the desk WIDENS and the same pile grows onto it while
       the read sweep returns, slower and skipping pages; the vendor's own sentence lands; and
       "context rot" is the only two-word gold title beat in the body of the video.
  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":171},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":5.69}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-paste-myth.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-paste-myth" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="deskhost" id="deskhost"></div>
        <div class="pilehost" id="pilehost"></div>
        <div class="sweephost" id="sweephost"></div>

        <div class="mythwrap" id="mythwrap">
          <div class="fx-myth" id="myth"></div>
          <span class="fx-slash" id="slash"></span>
        </div>

        <div class="fx-plate docs" id="docs">
          <div class="dtext" id="dtext"></div>
          <span class="fx-chip dchip" id="dchip"></span>
        </div>

        <div class="rot" id="rot"><span class="fx-gold" id="rottext"></span></div>
      </div>
    </div>
    <script src="cw-paste-myth.js"></script>
  </body>
</html>
