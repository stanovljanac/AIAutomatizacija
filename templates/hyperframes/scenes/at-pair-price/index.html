<!doctype html>
<!--
  at-pair-price — 023 long s18 (phase 1) + s19 (phase 2). The bill, as two grids you can count.

  ph1  the short note's 30x30 grid is drawn cell by cell and counted to 900; the padded note's
       236x236 grid is drawn beside it AT THE SAME CELL SIZE and runs off the frame in both
       directions. The comparison is the AREA, not the numbers — the numbers only confirm it. The
       chip states plainly that these are arithmetic, not a measurement.
  ph2  the concession, scoped. Real mitigations land on the big grid and genuinely take cells out —
       cached prefixes go grey, a sparse window keeps a band, streaming keeps the ends — and the
       frame gets visibly cheaper. Then the scope chip lands and the remaining cells re-light: for
       FULL attention, every pair is still scored.

  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":469},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":15.63}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="at-pair-price.css" />
  </head>
  <body>
    <div id="root" data-composition-id="at-pair-price" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="gridwrap small" id="gwA">
          <div class="glbl" id="glblA"></div>
          <canvas class="gcanvas" id="gcA" width="600" height="600"></canvas>
          <div class="gcount fx-mono" id="gcntA">0</div>
          <div class="gsub" id="gsubA"></div>
        </div>

        <div class="gridwrap big" id="gwB">
          <div class="glbl" id="glblB"></div>
          <canvas class="gcanvas" id="gcB" width="900" height="900"></canvas>
          <div class="gcount fx-mono" id="gcntB">0</div>
          <div class="gsub" id="gsubB"></div>
        </div>

        <div class="ratios" id="ratios">
          <span class="rt" id="rtText"></span>
          <span class="rteq">=</span>
          <span class="rt gold" id="rtWork"></span>
        </div>

        <span class="fx-chip arith" id="arith"></span>

        <!-- ph2 -->
        <div class="mits" id="mits"></div>
        <span class="fx-chip scope" id="scope"></span>
        <div class="verdict fx-h2" id="verdict"></div>
      </div>
    </div>
    <script src="at-pair-price.js"></script>
  </body>
</html>
