<!doctype html>
<!--
  nw-token-teaser — HyperFrames CAUSAL SIGN-OFF = THE CTA for 019 Short, s5 ("So it's guessing one
  word at a time. But what's a 'word' to an AI? Not what you'd think — it's called a token. That's
  the next piece.").  Black + gold outro. NO "subscribe for more" — the next-concept pull IS the
  CTA. Flat, face-on, no 3D tilt.

  BEAT 0  "guessing one word at a time" — the carried gold "guess → verify" node sits at top; the
          phrase shows with the word "word" highlighted.
  BEAT 1  "But what's a 'word' to an AI?" — a demo word "understanding" FRACTURES at odd
          boundaries into sub-word chunks: "under" + "standing".
  BEAT 2  "it's called a token" — a gold "TOKEN" label locks onto one chunk.
  BEAT 3  "That's the next piece." — a forward chevron points to a dim "next lesson" plate (a Desk
          Lessons through-line marker); the Automation Desk mark sits small in reserved space.

  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds
  + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1080},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1920},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":238},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":7.93}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="../nw-token-teaser.css" />
  </head>
  <body>
    <div id="root" data-composition-id="nw-token-teaser" data-start="0" data-duration="7.916666666666667" data-width="1080" data-height="1920">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="glow" id="glow"></div></div>

      <div class="camera" id="camera">
        <!-- the carried "guess → verify" node -->
        <div class="carry" id="carry"><span class="cc">✓</span> treat it as a guess → verify</div>

        <!-- the phrase, with "word" highlighted -->
        <div class="phrase" id="phrase">one <span class="hi" id="wordhi">word</span> at a time</div>

        <!-- the demo word that fractures -->
        <div class="demo" id="demo">
          <span class="chunk" id="ch1">under</span><span class="split" id="split"></span><span class="chunk" id="ch2">standing</span>
          <div class="tokenlabel" id="tokenlabel">TOKEN</div>
        </div>

        <!-- the causal sign-off plate -->
        <div class="next" id="next">
          <div class="chev" id="chev">
            <svg viewBox="0 0 60 40"><path d="M10 6 L34 20 L10 34" /><path d="M28 6 L52 20 L28 34" /></svg>
          </div>
          <div class="plate">
            <div class="pk">NEXT DESK LESSON</div>
            <div class="pt">What's a “word” to an AI?</div>
          </div>
        </div>

        <!-- the channel mark, small, reserved space -->
        <div class="brand" id="brand"><span class="bmark">▟</span> The Automation Desk · <b>Desk Lessons</b></div>
      </div>
    </div>
    <script src="../nw-token-teaser.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["nw-token-teaser"] = tl;
    </script>
  </body>
</html>
