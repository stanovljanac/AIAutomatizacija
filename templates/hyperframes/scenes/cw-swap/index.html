<!doctype html>
<!--
  cw-swap — 022 long s25 (phase 1) + s26 (phase 2), and 022 Short s5 (phase 3). The series' signature
  close, black+gold.
  ph1  THE SWAP: the wrong model arrives as the gray plate one last time and is struck. The scripted
       0.8s pause sits AFTER that line, so the wrong picture stops dead before the right one lands.
       Then the right model rises as a single monolith — the thumbnail-grade frame of this video.
  ph2  CAUSAL SIGN-OFF = THE CTA: the pile stands, faint gold threads reach from the reading point to
       a handful of pages and ignore the rest (a wordless first glimpse of attention, never explained
       here), a dim "next lesson" plate sits in RESERVED space, and the closing question is held.
  ph3  the Short's own vertical cut of the same close.
  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":375},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":12.5}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-swap.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-swap" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="mythwrap" id="mythwrap">
          <div class="fx-myth" id="myth"></div>
          <span class="fx-slash" id="slash"></span>
        </div>

        <div class="mono" id="mono"><span class="fx-gold" id="monotext"></span></div>

        <div class="pilehost" id="pilehost"></div>
        <svg class="threads" id="threads" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
        <div class="eye" id="eye"></div>

        <div class="nextplate" id="nextplate"><span class="nlbl" id="nlbl"></span><span class="ntxt" id="ntxt"></span></div>
        <div class="question" id="question"></div>
      </div>
    </div>
    <script src="cw-swap.js"></script>
  </body>
</html>
