<!doctype html>
<!--
  tk-letters-never-arrived — HyperFrames HOOK HERO for 021 long, s1
  ("You've watched an AI write working code in ten seconds, then get the letters in a single word
    wrong. Everyone reads that as the machine being dumb. It isn't. The letters never arrived.")
  Black + gold hero. Flat, face-on — nothing rests at a 3D angle (MOTION_SPEC §5).

  BEAT 0  COMPETENCE FIRST: a clean code block assembles itself line by line in ~1.5s and a timer
          chip runs to 10s with a green tick — this machine is good. Then the hard beat change:
          the code slides off and ONE word stands alone, huge, with a wrong letter count under it
          that takes a small red correction stamp. A REMEMBERED failure: no chat UI, no product
          name, no model badge, no cursor.
  BEAT 1  "the machine being dumb" — the gray myth label rises.
  BEAT 2  "It isn't." — a hard gold slash strikes it through.
  BEAT 3  "The letters never arrived." — the letters FALL AWAY and one opaque gold capsule is left
          standing in their place, nothing legible inside. That capsule is the video's spine object
          (it returns in s7, s8, s21, s22).

  Silent + deterministic (no Math.random / Date.now); one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":360},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":12.0}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="../tk-letters-never-arrived.css" />
  </head>
  <body>
    <div id="root" data-composition-id="tk-letters-never-arrived" data-start="0" data-duration="11.983333333333333" data-width="1920" data-height="1080">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="glow" id="glow"></div></div>

      <!-- BEAT 0a — the competence: code assembling itself -->
      <div class="codecard" id="codecard">
        <div class="chead"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="timer" id="timer">0.0s</span>
        </div>
        <pre class="code" id="code"></pre>
        <div class="ok" id="ok">✓ ran</div>
      </div>

      <!-- BEAT 0b — the remembered failure -->
      <div class="wordwrap" id="wordwrap">
        <div class="word" id="word"></div>
        <div class="capsule" id="capsule"><span class="sheen"></span></div>
      </div>
      <div class="countrow" id="countrow">
        <span class="count" id="count">2 r's</span>
        <span class="stamp" id="stamp">✕</span>
      </div>

      <!-- BEAT 1/2 — the myth and the slash -->
      <div class="mythwrap" id="mythwrap">
        <span class="myth" id="myth"></span>
        <span class="slash" id="slash"></span>
      </div>

      <!-- BEAT 3 — the thesis -->
      <div class="title" id="title"></div>
    </div>
    <script src="../tk-letters-never-arrived.js"></script>
  </body>
</html>
