<!doctype html>
<!--
  tk-next-lesson — 021 long s23 (phase 1) + s24 (phase 2) + Short s5 (phase "short"). ONE file so the
  context-window frame s23 draws is the same frame s24's closing question lands inside (author carry).

  CAUSAL SIGN-OFF = THE CTA (black+gold). Series decision carried from 019: NO "subscribe for more" —
  the pull to the next concept IS the CTA.

  PHASE 1 (s23)  a long row of capsules streams in; a frame CLOSES around them and everything outside
                 it dims and drops away — the context window SHOWN, one beat only, never taught here
                 (that is Ep.3). The dim next-lesson plate sits in RESERVED space, in the same
                 gold-on-black Desk Lessons type as 019 s5.
  PHASE 2 (s24)  the closing question lands in the frame the box left behind; on "I collect them" four
                 tiny gray failure cards drift in and settle on a small collection shelf — warm, human,
                 a little funny. The brand mark stays in reserved space, never over the text.
  PHASE short    the s23 beat, vertical, with the brand mark.

  Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":313},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":10.45}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="../tk-next-lesson.css" />
  </head>
  <body>
    <div id="root" data-composition-id="tk-next-lesson" data-start="0" data-duration="8.283333333333333" data-width="1080" data-height="1920">
      <div class="bg" data-layout-ignore><div class="aurora"></div><div class="glow" id="glow"></div></div>

      <div class="stream" id="stream"><div class="streamtrack" id="streamtrack"></div></div>
      <div class="window" id="window"></div>

      <div class="question" id="question"></div>
      <div class="shelf" id="shelf"><div class="cards" id="cards"></div><span class="shelfline"></span></div>

      <div class="plate" id="plate">
        <span class="series" id="series"></span>
        <span class="next" id="next"></span>
      </div>
      <div class="brand" id="brand"></div>
    </div>
    <script src="../tk-next-lesson.js"></script>
  </body>
</html>
