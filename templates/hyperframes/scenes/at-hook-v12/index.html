<!doctype html>
<!--
  at-hook-v12 — 023 long s1, HOOK HERO (2D). The V1.2 alternative to at3d-hook-v11.

  Same dramaturgy as the 3D cut, deliberately different craft. Flat DOM buys three things the room
  cannot: pin-sharp type at any size (no depth-of-field softening the one thing the viewer has to
  read), total control of what sits on top of what, and a literal MEASURE — when the reply comes
  back, a gold rule draws under each answer at its own length, so "worse" is a thing you can see the
  size of rather than a thing you are told.

  It obeys the same three rules the 023 review produced:
    1. ESTABLISH BEFORE YOU ATTACK — frame 1 is a whole, recognisable chat with a good short answer
       already in it. The window is a fixed frame; the CONTENT scrolls inside it.
    2. ONE LIT OBJECT PER BEAT — when the reply lands the thread desaturates and steps back; nothing
       else moves.
    3. FLAT TYPE ALWAYS GETS AN OPAQUE PLATE, and what is killed leaves at 0.

  The budget bar hands over at the geometry s2 (at-budget-bar) actually opens on — left/right 120px,
  top 196px, 62px tall — so the video's spine object matches across the cut.

  b0  0.0   a real chat, then four pasted documents flood it
  b1  b1    the thread steps back; the stub reply lands, and both answers get measured
  b2  b2    "Everyone calls that losing focus" — an OPAQUE myth band + the spotlight cone
  b3  b3    the slash; the cone collapses into the budget bar; the kicker lands on its own plate

  Deterministic: one paused, seek-driven GSAP timeline. No rAF, no Date.now, no Math.random.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,revealsSeconds[],props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":344},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":11.4667}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="at-hook-v12.css" />
  </head>
  <body>
    <div id="root" data-composition-id="at-hook-v12" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <!-- ── the chat: a fixed frame whose CONTENT is what grows ────────────── -->
          <div class="win" id="win">
          <div class="wtitle"><span class="wdot"></span><span class="wname">New chat</span></div>
          <div class="wview" id="wview">
            <div class="thread" id="thread"></div>
            <!-- the sticky copy of the good answer: DOM has no sticky inside a transformed
                 scroller, so the pin is an explicit element that fades in once the thread has
                 scrolled past the original. It is fully opaque — nothing ever prints through it. -->
            <div class="pinned" id="pinned"></div>
            <div class="rail"><div class="thumb" id="thumb"></div></div>
          </div>
          <div class="wcomposer"><span class="wcaret" id="wcaret"></span><span class="wsend"></span></div>
        </div>

      </div>

      <!-- the flat type layer sits OUTSIDE #world, above _lib's near layer (see note) -->
      <div class="scrim" id="scrim"></div>
        <!-- the myth, on an OPAQUE band -->
        <div class="mythwrap" id="mythwrap">
          <div class="cone" id="cone"></div>
          <div class="mythband">
            <div class="fx-myth mythtext" id="myth"></div>
            <span class="fx-slash" id="slash"></span>
          </div>
        </div>

        <!-- THE BUDGET BAR — the spine object, at the geometry s2 opens on -->
        <div class="budget" id="budget">
          <div class="btrack">
            <div class="bfill" id="bfill"></div>
            <div class="bedge"></div>
          </div>
          <div class="blbl"><span id="blbltext"></span><span class="bone" id="bone">1.0000000</span></div>
        </div>

        <div class="kicker" id="kicker"><span class="fx-gold" id="kickertext"></span></div>
    </div>
    <script src="at-hook-v12.js"></script>
  </body>
</html>
