<!doctype html>
<!--
  at-swap — 023 long s25 (the swap) + s26 (the sign-off into Ep.5). Black + gold monolith.

  ph1  the signature Desk Lessons close: the old sentence is set as one big line and physically
       LIFTED OUT of the frame, and the new one is set down in its place with the budget bar under
       it — full, hard-edged, unchanged. One line of big type BY DESIGN: this is deliberately the
       least busy frame in the video, and the frame gate's cta floor exists for exactly this.
  ph2  the sign-off: the scores the budget is divided WITH appear for the first time as a separate
       object — a sealed block, dated before the viewer ever typed — and a line typed at it changes
       nothing inside the seal. The closing question is the last readable thing on screen.

  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":515},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":17.16}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="at-swap.css" />
  </head>
  <body>
    <div id="root" data-composition-id="at-swap" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <!-- ph1 -->
        <div class="dropwrap" id="dropwrap">
          <span class="dtag">drop this</span>
          <div class="dline" id="dline"></div>
          <span class="fx-slash dslash" id="dslash"></span>
        </div>
        <div class="keepwrap" id="keepwrap">
          <span class="ktag">keep this</span>
          <div class="kline" id="kline"></div>
        </div>
        <div class="budget" id="budget"><div class="btrack"><div class="bfill" id="bfill"></div><div class="bedge"></div></div></div>

        <!-- ph2 -->
        <div class="seal" id="seal">
          <div class="sealhead" id="sealhead">the scores it divides the budget with</div>
          <div class="sealbody" id="sealbody"></div>
          <div class="sealstamp" id="sealstamp">frozen · before you ever typed</div>
        </div>
        <div class="chatline" id="chatline"><span class="chattxt fx-mono" id="chattxt"></span></div>
        <div class="next" id="next"><span class="fx-gold" id="nexttext"></span></div>
        <div class="question" id="question"></div>
        <div class="handle" id="handle"></div>
      </div>
    </div>
    <script src="at-swap.js"></script>
  </body>
</html>
