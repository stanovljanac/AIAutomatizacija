<!doctype html>
<!--
  cw-handoff — 022 long s4, the MECHANISM HERO (16:9). Replaces cw-desk-cycle phase 1.

  WHY IT WAS REBUILT (owner, 2026-08-17): the old scene ended each turn by WIPING the desk. A wipe
  in place reads as a render bug, not as a process — and the last wipe left ~5s of empty desk under
  live narration. The fix is not a longer cycle, it is a different verb: the stack is never erased,
  it is HANDED OVER. It enters from the left, is read, gains a page, and leaves to the right while
  the next one is already entering — so the frame is never empty and the repetition reads as
  escalation instead of breakage.

  THE MECHANISM, ONE TURN
    · the stack slides in from the left and lands with weight (contact flash + settle)
    · a gold bar reads it top → bottom — VISIBLY SLOWER each turn, because the stack is taller
    · it writes ONE gold page (its own answer) on top
    · it slides out right and parks as a dim GHOST on a receding trail; the next stack, one page
      taller (your new white message on top of its gold answer), is already entering from the left
    · a chip counts turn 1 · 2 · 3 · 4

  BEATS (revealsSeconds)
    b0  "So picture a desk instead of a brain."      the gray brain dissolves, the wide desk arrives
    b1  "Every turn, you put the whole stack down…"  turn 1 lands and FANS so you can count it; the
                                                    gold page INSIDE the stack is named
    b2  "It reads the stack from the top…"           the handoff runs, each read longer than the last
    b3  "Then you hand it the stack again."          the tallest stack lands and holds

  Silent + deterministic; one paused, seek-driven GSAP timeline. No callbacks (the capture engine
  seeks out of order) — property tweens and onUpdate writes only.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,revealsSeconds[],props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":544},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":18.13}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-handoff.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-handoff" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <!-- the wrong picture, dissolving out of the way -->
        <svg class="brain" id="brain" viewBox="0 0 200 200" fill="none">
          <circle cx="100" cy="100" r="72" stroke="#5d6f83" stroke-width="5" />
          <path d="M100 30 C 78 62, 122 78, 100 108 C 82 134, 120 146, 100 170" stroke="#5d6f83" stroke-width="5" stroke-linecap="round" />
          <path d="M62 58 C 84 84, 56 104, 74 132" stroke="#4d5d6f" stroke-width="4" stroke-linecap="round" />
          <path d="M138 58 C 116 84, 144 104, 126 132" stroke="#4d5d6f" stroke-width="4" stroke-linecap="round" />
        </svg>
        <div class="brainlbl" id="brainlbl"></div>

        <div class="deskhost" id="deskhost"></div>
        <!-- one .carrier host per turn is injected here; a carrier that has been handed over stays
             on screen as its own dim ghost, further right and smaller -->
        <div class="stage" id="stage"></div>
        <div class="sweephost" id="sweephost"></div>
        <div class="impact" id="impact"></div>

        <div class="tag" id="tag"></div>
        <div class="turnchip fx-chip" id="turnchip"></div>
        <div class="kicker fx-h2" id="kicker"></div>
      </div>
    </div>
    <script src="cw-handoff.js"></script>
  </body>
</html>
