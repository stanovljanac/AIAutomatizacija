<!doctype html>
<!--
  tk-language-tax — 021 long s15 (phase 1) + s16 (phase 2). ONE growing chart, never four cards, and
  one file so the finished chart survives the boundary at the same size and position (author carry).

  The same sentence in four languages, stacked as horizontal capsule-runs where EACH CAPSULE IS A REAL
  TOKEN, counting up to 12 / 18 / 21 / 21 (measured with tiktoken, o200k_base — the caption says so,
  so this reads as a measurement and not a universal constant). English finishes first and shortest;
  the others visibly OVERRUN past its end line.

  NO flags and NO country iconography — this is about a tokenizer, not nations.

  PHASE 2 labels the overrun with the MEASURED multiple against the English baseline (+75% · 1.75×,
  drawn on the Hindi/Japanese rows because "up to" is load-bearing — Spanish is 1.50×), moves the two
  s14 instruments IN STEP with the bracket, then dims the chart for one gold line.

  Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":400},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":13.33}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <link rel="stylesheet" href="tk-language-tax.css" />
  </head>
  <body>
    <div id="root" data-composition-id="tk-language-tax" data-start="0" data-width="1920" data-height="1080">
      <div class="bg" data-layout-ignore><div class="grid"></div><div class="glow" id="glow"></div></div>

      <div class="sentence" id="sentence"></div>

      <div class="chart" id="chart">
        <span class="endline" id="endline"></span>
        <span class="bracket" id="bracket"><span class="blabel" id="blabel"></span></span>
      </div>

      <div class="mini" id="mini">
        <div class="mrow"><span class="mlab">MEMORY</span><span class="mbar"><span class="mfill" id="mfill"></span></span></div>
        <div class="mrow"><span class="mlab">COST</span><span class="mnum" id="mnum">0.42</span></div>
      </div>

      <div class="line" id="line"></div>
      <div class="caption" id="caption"></div>
      <div class="chip" id="chip"></div>
    </div>
    <script src="tk-language-tax.js"></script>
  </body>
</html>
