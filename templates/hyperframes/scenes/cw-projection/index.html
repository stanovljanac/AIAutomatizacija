<!doctype html>
<!--
  cw-projection — 022 long s8. The growth is not gentle: turn N re-reads N turns.
  The eight MEASURED bars return small and dim at the left; the curve that continues from their tip
  is drawn DASHED and chipped "arithmetic · equal-size turns", so the tail can never be mistaken for
  data. Markers snap on at request 20 and request 40 as they are spoken. The curve visibly BENDS.
  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":447},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":14.9}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-projection.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-projection" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="chart" id="chart"></div>
        <svg class="plot" id="plot" viewBox="0 0 1500 560" preserveAspectRatio="none">
          <path id="proj" fill="none" stroke="#ffb020" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 16" />
        </svg>
        <div class="axis" id="axisline"></div>
        <div class="mark m20" id="m20"><span class="dot"></span><span class="mlbl" id="m20l"></span></div>
        <div class="mark m40" id="m40"><span class="dot"></span><span class="mlbl" id="m40l"></span></div>
        <div class="fx-chip chip measured" id="chipM"></div>
        <div class="fx-chip chip proj" id="chipP"></div>
        <div class="kicker fx-h2" id="kicker"><span class="fx-gold" id="kickertext"></span></div>
      </div>
    </div>
    <script src="cw-projection.js"></script>
  </body>
</html>
