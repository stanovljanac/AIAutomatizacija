<!doctype html>
<!--
  cw-window-frame — 022 long, s2 (phase 1) + s3 (phase 2). ONE file, two phases, so the gold window
  frame and the four labelled groups survive the s2→s3 boundary at exactly the same size and position
  (D-060 `carry`: the compositor cannot align two independently rendered clips — the AUTHOR does).

  PHASE 1 (s2, ANSWER-FIRST + the Desk Lessons correction motif, blue+gold)
    b0  the small gold motif tag — never a title card
    b1  a gold frame DRAWS itself around the pile carried in from s1; the top page dissolves into
        token capsules for a beat (the Ep.2 spine object) and re-forms
    b2  the same 13 pages redistribute into four labelled groups — conversation · instructions ·
        the document you pasted · the answer it's writing — all of it inside the one frame
    b3  "That part is true." — a GREEN TICK lands. It is deliberately NOT struck through.

  PHASE 2 (s3, THE TURN) — opens on the frame ALREADY in place, no reset
    b0  a gray ghost ROOM forms behind it: shelves with the conversation filed on them
    b1  "Nothing is kept." — shelves, boxes and every page evaporate upward in one beat
    b2  the frame is left EMPTY and slightly too quiet — composed emptiness, not a missing asset

  Silent + deterministic; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds + revealsSeconds[] + props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":541},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":18.04}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="cw-window-frame.css" />
  </head>
  <body>
    <div id="root" data-composition-id="cw-window-frame" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="motif fx-motif" id="motif"></div>

        <div class="room" id="room"></div>

        <div class="frame" id="frame">
          <span class="edge t" id="edgeT"></span>
          <span class="edge r" id="edgeR"></span>
          <span class="edge b" id="edgeB"></span>
          <span class="edge l" id="edgeL"></span>
          <span class="tick" id="tick">✓</span>
        </div>

        <div class="framelabel" id="framelabel"></div>
        <div class="pilehost" id="pilehost"></div>
        <div class="caps" id="caps"></div>
        <div class="rows" id="rows"></div>
        <div class="empty fx-h2" id="empty"></div>
      </div>
    </div>
    <script src="cw-window-frame.js"></script>
  </body>
</html>
