<!doctype html>
<!--
  at-take-off-desk — 023 long s21. The turn from mechanism to method, staged as an action.

  The desk is loaded with the padded note. The viewer's usual move is tried FIRST: "IMPORTANT:" is
  typed in capitals in front of it — and the bar simply re-divides with one MORE claimant, so the
  important line ends up smaller than it was. That fails on screen, with numbers.

  Then the other move: pages are physically pulled off the desk and dropped out of frame, and the
  surviving line's slice grows as each one leaves. The arithmetic does the arguing.

  Silent + deterministic. VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,
  revealsSeconds[], props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1920},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1080},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":407},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":13.58}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../_lib/gsap.min.js"></script>
    <script src="../../_lib/hf-scene.js"></script>
    <script src="../../_lib/hf-fx.js"></script>
    <link rel="stylesheet" href="../../_lib/hf-fx.css" />
    <link rel="stylesheet" href="at-take-off-desk.css" />
  </head>
  <body>
    <div id="root" data-composition-id="at-take-off-desk" data-start="0" data-width="1920" data-height="1080">
      <div id="world" class="fx-world">
        <div class="deskrow" id="deskrow"></div>

        <div class="barwrap">
          <div class="btrack"><div class="slices" id="slices"></div><div class="bedge"></div></div>
          <div class="brow">
            <span class="blbl">the answer's share</span>
            <span class="bval fx-mono" id="bval">10.0%</span>
          </div>
        </div>

        <div class="tryline" id="tryline"><span class="trylbl">the usual move</span><span class="trytext fx-mono" id="trytext"></span><span class="tryres" id="tryres"></span></div>

        <div class="kicker" id="kicker"><span class="fx-gold" id="kickertext"></span></div>
      </div>
    </div>
    <script src="at-take-off-desk.js"></script>
  </body>
</html>
