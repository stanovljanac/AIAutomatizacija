<!doctype html>
<!--
  wh-hour-flip — HyperFrames outro for video 014, s5 TAKEAWAY MONOLITH (black+gold). The takeaway is
  literally a FLIPPED question: "WILL AI TAKE YOUR JOB?" assembles, is struck through, and the whole
  line 3D Y-flips (real perspective) to reveal the real one — "WHICH HOUR WOULD YOU HAND OVER FIRST?"
  — held >=4s with a slow gold pulse (pause-and-screenshot). A comment-bait line ("Mine was the
  copy-paste. Yours?") with a blinking gold caret. The brand row rises in RESERVED space below the
  question (never over text — D-054, 012 benchmark). Slow push-in throughout.

  Silent + deterministic: NO Math.random / Date.now; one paused, seek-driven GSAP timeline.
  VARIABLES CONTRACT: fps,width,height,durationFrames,durationSeconds,revealsSeconds[],props{}.
-->
<html
  lang="en"
  data-composition-variables='[
    {"id":"fps","type":"number","label":"Render FPS","default":30},
    {"id":"width","type":"number","label":"Canvas width (px)","default":1080},
    {"id":"height","type":"number","label":"Canvas height (px)","default":1920},
    {"id":"durationFrames","type":"number","label":"Exact output frames","default":406},
    {"id":"durationSeconds","type":"number","label":"durationFrames / fps","default":13.52}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="../gsap.min.js"></script>
    <link rel="stylesheet" href="../wh-hour-flip.css" />
  </head>
  <body>
    <div id="root" data-composition-id="wh-hour-flip" data-start="0" data-duration="13.516666666666667" data-width="1080" data-height="1920">
      <div class="bg" data-layout-ignore><div class="aurora" id="aurora"></div><div class="floor"></div></div>

      <div class="camera" id="camera">
        <div class="kicker" id="kicker">SO STOP ASKING</div>

        <div class="flipzone">
          <div class="fliprig" id="fliprig">
            <div class="qface qA" id="qA">WILL AI TAKE<br />YOUR JOB?<div class="strike" id="strike"></div></div>
            <div class="qface qB" id="qB"><span class="gold">WHICH HOUR</span><br />WOULD YOU HAND<br />OVER FIRST?</div>
          </div>
        </div>

        <div class="bait" id="bait">
          <span class="line">Mine was the copy-paste. <b>Yours?</b><span class="caret" id="caret"></span></span>
        </div>

        <div class="brandrow" id="brandrow">
          <div class="b-mark">A</div>
          <div class="b-copy"><div class="b-name">The Automation Desk</div><div class="b-cta">the worst hour of every job</div></div>
        </div>
      </div>
    </div>
    <script src="../wh-hour-flip.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["wh-hour-flip"] = tl;
    </script>
  </body>
</html>
